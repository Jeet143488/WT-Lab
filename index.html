
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Explore the vision, mission, courses, program outcomes, gallery, and recruiters of the Department of Computer Engineering at Marwadi University.">

  <title>Computer Engineering | Marwadi University</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

  <style>
    :root {
      --primary: #17365d;
      --secondary: #28527a;
      --accent: #14b8a6;
      --light: #f1f5f9;
      --text: #334155;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 85px;
    }

    body {
      background: var(--light);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      line-height: 1.7;
    }

    a {
      text-decoration: none;
    }

    /* Navigation */
    .navbar {
      background: var(--primary);
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.12);
    }

    .navbar-brand {
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .navbar .nav-link {
      color: #e2e8f0;
      margin: 0 5px;
      transition: color 0.25s;
    }

    .navbar .nav-link:hover,
    .navbar .nav-link:focus {
      color: #5eead4;
    }

    /* Hero */
    .hero {
      color: white;
      background:
        radial-gradient(
          circle at 85% 20%,
          rgba(45, 212, 191, 0.25),
          transparent 30%
        ),
        linear-gradient(135deg, #102a43, #28527a 65%, #0f766e);
      padding: 100px 20px 90px;
      text-align: center;
    }

    .hero .university-tag {
      display: inline-block;
      padding: 7px 16px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 0.9rem;
      margin-bottom: 22px;
    }

    .hero h1 {
      font-size: clamp(2.2rem, 5vw, 3.7rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 18px;
    }

    .hero h2 {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 500;
      margin-bottom: 18px;
    }

    .hero p {
      max-width: 680px;
      margin: 0 auto 28px;
      color: #e2e8f0;
    }

    .btn-accent {
      color: #062d35;
      background: #5eead4;
      border: 1px solid #5eead4;
      font-weight: 700;
      padding: 11px 22px;
      transition: all 0.25s ease;
    }

    .btn-accent:hover {
      color: white;
      background: transparent;
      border-color: white;
      transform: translateY(-2px);
    }

    .btn-outline-light {
      padding: 11px 22px;
    }

    /* General sections */
    .content-section {
      padding: 34px;
      margin-bottom: 28px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(23, 54, 93, 0.06);
      border: 1px solid #e8eef5;
    }

    .section-title {
      color: var(--primary);
      font-weight: 800;
      padding-bottom: 13px;
      margin-bottom: 22px;
      border-bottom: 2px solid #dbeafe;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title i {
      color: #0f9f95;
    }

    .section-lead {
      color: #64748b;
      margin-top: -12px;
      margin-bottom: 24px;
    }

    /* Vision and mission */
    .info-card {
      height: 100%;
      padding: 25px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .info-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(23, 54, 93, 0.1);
    }

    .icon-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      margin-bottom: 15px;
      color: #0f766e;
      background: #ccfbf1;
      border-radius: 14px;
      font-size: 1.5rem;
    }

    .info-card h4 {
      color: var(--primary);
      font-weight: 750;
      font-size: 1.15rem;
    }

    .mission-list,
    .outcome-list {
      padding-left: 20px;
      margin-bottom: 0;
    }

    .mission-list li,
    .outcome-list li {
      padding-left: 5px;
      margin-bottom: 12px;
    }

    .mission-list li::marker,
    .outcome-list li::marker {
      color: #0f9f95;
    }

    /* Courses */
    .course-card {
      height: 100%;
      background: white;
      padding: 24px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      transition: all 0.25s ease;
    }

    .course-card:hover {
      border-color: var(--accent);
      transform: translateY(-5px);
      box-shadow: 0 10px 24px rgba(23, 54, 93, 0.1);
    }

    .course-card .icon-box {
      width: 48px;
      height: 48px;
    }

    .course-card h4 {
      font-size: 1.08rem;
      color: var(--primary);
      font-weight: 750;
    }

    .course-card p {
      color: #64748b;
      font-size: 0.94rem;
      margin-bottom: 0;
    }

    /* Gallery */
    .gallery-image {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 12px;
      transition: transform 0.4s ease;
    }

    .gallery-item {
      overflow: hidden;
      border-radius: 12px;
      background: #e2e8f0;
    }

    .gallery-item:hover .gallery-image {
      transform: scale(1.06);
    }

    .gallery-caption {
      padding: 12px 5px 0;
      font-weight: 650;
      color: var(--primary);
    }

    /* Recruiters */
    .recruiter-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px;
      height: 100%;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #f8fafc;
      font-weight: 650;
      color: var(--primary);
      transition: all 0.2s;
    }

    .recruiter-card:hover {
      background: #ecfdf5;
      border-color: #5eead4;
    }

    .recruiter-card i {
      font-size: 1.2rem;
      color: #0f9f95;
    }

    /* Footer */
    footer {
      background: #102a43;
      color: #cbd5e1;
      padding: 38px 20px 20px;
    }

    footer h5 {
      color: white;
      font-weight: 800;
    }

    footer a {
      color: #cbd5e1;
      transition: color 0.2s;
    }

    footer a:hover {
      color: #5eead4;
    }

    .footer-divider {
      border-color: rgba(255, 255, 255, 0.15);
      margin: 25px 0 18px;
    }

    @media (max-width: 767px) {
      .hero {
        padding: 75px 18px 65px;
      }

      .content-section {
        padding: 23px 18px;
        border-radius: 14px;
      }

      .gallery-image {
        height: 200px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
